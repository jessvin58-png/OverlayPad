
name: Build OverlayPad

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build iOS dylib
        run: make ARCH=arm64 MIN_IOS=15.0 CFLAGS="-UJOY_HAS_AVATAR"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: OverlayPad-iOS
          path: OverlayPad.dylib
          if-no-files-found: error
